syntax = "proto3";

package chat.v1;

// Required by grpc-ecosystem/openapiv3, even though this project generates no Go.
// Replace the module path if the API is ever used in a real Go module.
option go_package = "github.com/example/protobuf-buf-chat/chat/v1;chatv1";

import "google/api/annotations.proto";

// One API contract for REST, ConnectRPC, and native gRPC.
service ChatService {
  // Existing unary API.
  // REST is generated from this HTTP annotation, not a handwritten FastAPI route.
  rpc Say(SayRequest) returns (SayResponse) {
    option (google.api.http) = {
      post: "/api/chat"
      body: "*"
    };
  }

  // Server-streaming API.
  // REST wire format is normalized to NDJSON in OpenAPI post-processing.
  rpc StreamSay(SayRequest) returns (stream ChatEvent) {
    option (google.api.http) = {
      post: "/api/chat/stream"
      body: "*"
    };
  }
}

message SayRequest {
  // User's message. The demo always returns the same reply.
  string text = 1;
}

message SayResponse {
  // Assistant response.
  string reply = 1;
}

message ChatEvent {
  uint32 sequence = 1;

  oneof payload {
    ChatStart start = 2;
    ChatDelta delta = 3;
    ChatComplete complete = 4;
    ChatFailure failure = 5;
  }
}

message ChatStart {
  string message_id = 1;
}

message ChatDelta {
  string text = 1;
}

message ChatComplete {
  string reply = 1;
}

message ChatFailure {
  string code = 1;
  string message = 2;
}
