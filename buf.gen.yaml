version: v2
plugins:
  # Native Python protobuf and RPC services (unchanged transports).
  - remote: buf.build/protocolbuffers/python:v36.2
    out: backend/python/chat/src
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: backend/python/chat/src
  - remote: buf.build/grpc/python
    out: backend/python/chat/src
  - remote: buf.build/connectrpc/py
    out: backend/python/chat/src
    opt:
      - protobuf=google

  - remote: buf.build/bufbuild/es
    out: frontend/vue3/chat/src/gen
    # chat_pb.ts imports google/api/annotations_pb generated from the imported proto.
    # Include imports for TypeScript only; Python uses googleapis-common-protos.
    include_imports: true
    opt:
      - target=ts

  # ConnectRPC's own wire endpoint documentation (NOT the REST contract).
  - remote: buf.build/community/sudorandom-connect-openapi
    out: proto/chat/gen/openapi/connect

  # google.api.http annotations -> OpenAPI 3.1 -> Pydantic + FastAPI router.
  # NOTE: openapiv3 is currently an ALPHA generator; see README.
  - remote: buf.build/grpc-ecosystem/openapiv3
    out: proto/chat/gen/openapi/rest
    opt:
      - disable_default_errors=true
