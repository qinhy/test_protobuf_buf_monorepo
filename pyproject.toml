[project]
name = "protobuf-buf-chat-demo"
version = "0.1.0"
description = "Chat Protobuf monorepo orchestration and tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chat-backend==0.1.0",
]

[tool.uv.sources]
chat-backend = { path = "backend/python/chat", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "datamodel-code-generator==0.96.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
