[package]
name = "chat-backend"
version = "0.1.0"
edition = "2024"
description = "Standalone Rust ChatService server with Protobuf, ConnectRPC, native gRPC, and OpenAPI-backed REST"
build = "build.rs"

[[bin]]
name = "chat-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bytes = "1"
http = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

[build-dependencies]
prost = "0.14"
protox = "0.10"
serde_json = "1"
tonic-prost-build = "0.14"
