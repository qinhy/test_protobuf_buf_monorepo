[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-backend"
version = "0.1.0"
description = "Standalone Python ChatService server with Protobuf, ConnectRPC, native gRPC, and generated FastAPI REST"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.14,<3",
    "protobuf>=7.36.2,<8",
    "grpcio>=1.66,<2",
    "connectrpc==0.13.0",
    "googleapis-common-protos>=1.65,<2",
    "typing-extensions>=4.16",
]

[project.scripts]
chat-server = "chat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chat*"]

# Installed by `uv sync` or `uv run` when invoked from this directory.
# They are backend-local: a root pyproject.toml is not required.
[dependency-groups]
dev = [
    "datamodel-code-generator==0.96.0",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
